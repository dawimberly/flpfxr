name: Public estimator checks
on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/public-estimator-smoke.mjs"
      - ".github/workflows/public-estimator.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test src/components/public-project-estimator.test.ts
      - run: npm run build:dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:auth
      - run: npx playwright install --with-deps chromium
      - run: node scripts/public-estimator-smoke.mjs

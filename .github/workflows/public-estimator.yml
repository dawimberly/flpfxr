name: Public estimator checks
on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/public-estimator-smoke.mjs"
      - ".github/workflows/public-estimator.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test src/components/public-project-estimator.test.ts
      - run: npm run build:dev
      - run: npm run typecheck
      - run: node --experimental-strip-types --test src/lib/lead-draft.test.ts src/lib/lead-conversion.test.ts src/lib/lead-submit.server.test.ts src/lib/auth/gate-identity.test.ts src/lib/roof-public-quote.test.ts src/lib/roof-3d.test.ts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/public-estimator-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-estimator-browser-shots
          path: public-estimator-smoke-*.png
          if-no-files-found: ignore
